services:
  carenote:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      CARENOTE_DB: /app/data/carenote.db
      DEMO_MODE: ${DEMO_MODE:-1}
      CARENOTE_SESSION_SECRET: ${CARENOTE_SESSION_SECRET:-local-demo-secret-change-me}
    volumes:
      - carenote-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  carenote-data:
